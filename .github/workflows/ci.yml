name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the full test suite
        run: docker compose up --build --exit-code-from tests

      - name: Tear down
        if: always()
        run: docker compose down -v
