apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a single ReadWriteOnce PVC can't be mounted by
  # an old and a new pod at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - configMapRef:
                name: ctd-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctd-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # -h 127.0.0.1 forces a real TCP check, same reasoning as the
          # docker-compose healthcheck (see docker-compose.yml comment).
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kungfuchess", "-h", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kungfuchess", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
